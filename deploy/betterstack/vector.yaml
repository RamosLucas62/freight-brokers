api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  easypanel_containers:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers:
      - better-stack-vector

transforms:
  parse_freight_audit_json:
    type: remap
    inputs:
      - easypanel_containers
    source: |
      structured = parse_json(.message) ?? {}
      if is_object(structured) {
        . = merge(., object!(structured))
      }

  keep_freight_audit:
    type: filter
    inputs:
      - parse_freight_audit_json
    condition: '.service == "freight-audit"'

  remove_healthcheck_noise:
    type: filter
    inputs:
      - keep_freight_audit
    condition: '!(.event == "http.request.completed" && includes(["/healthz", "/readyz"], .path))'

sinks:
  better_stack:
    type: http
    method: post
    inputs:
      - remove_healthcheck_noise
    uri: "https://s2746448.us-west-2a.betterstackdata.com/"
    compression: gzip
    encoding:
      codec: json
    auth:
      strategy: bearer
      token: ${BETTER_STACK_SOURCE_TOKEN}
    acknowledgements:
      enabled: true
    buffer:
      type: disk
      max_size: 300000000
      when_full: drop_newest
